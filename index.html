function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function generateQuiz(cat) {
  const questions = cat.phrases.map(p => {
    const type = Math.random() < 0.5 ? "p2m" : "m2p";
    const correct = type === "p2m" ? p.meaning : p.phrase;
    const questionText = type === "p2m" ? p.phrase : p.meaning;
    const others = cat.phrases.filter(x => x.phrase !== p.phrase);
    const distractorPool = shuffleArray(others).slice(0, 3);
    const distractors = distractorPool.map(o => type === "p2m" ? o.meaning : o.phrase);
    const options = shuffleArray([correct, ...distractors]);
    return { type, questionText, correct, options };
  });
  return shuffleArray(questions);
}

  const [quizMode, setQuizMode] = useState(false);
  const [quizQuestions, setQuizQuestions] = useState([]);
  const [quizIndex, setQuizIndex] = useState(0);
  const [quizScore, setQuizScore] = useState(0);
  const [selectedOption, setSelectedOption] = useState(null);
  const [quizFinished, setQuizFinished] = useState(false);

  const [showTranslator, setShowTranslator] = useState(false);
  const [translatorDir, setTranslatorDir] = useState("ar-en");
  const [translatorInput, setTranslatorInput] = useState("");
  const [translatorResult, setTranslatorResult] = useState("");
  const [translatorLoading, setTranslatorLoading] = useState(false);
  const [translatorError, setTranslatorError] = useState(null);

  const translateText = async () => {
    if (!translatorInput.trim()) return;
    setTranslatorLoading(true);
    setTranslatorError(null);
    setTranslatorResult("");
    const sl = translatorDir === "ar-en" ? "ar" : "en";
    const tl = translatorDir === "ar-en" ? "en" : "ar";
    try {
      // Primary: Google Translate's public web endpoint — no API key needed, CORS-enabled,
      // works from any static site (perfect for GitHub Pages).
      const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(translatorInput)}`;
      const response = await fetch(url);
      if (!response.ok) throw new Error("google-failed");
      const data = await response.json();
      const translated = (data[0] || []).map(chunk => chunk[0]).join("");
      if (!translated.trim()) throw new Error("empty-result");
      setTranslatorResult(translated.trim());
    } catch (err) {
      try {
        // Fallback: MyMemory Translation API — also free, keyless, CORS-enabled.
        const langpair = `${sl}|${tl}`;
        const url2 = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(translatorInput)}&langpair=${langpair}`;
        const response2 = await fetch(url2);
        const data2 = await response2.json();
        const translated2 = data2 && data2.responseData && data2.responseData.translatedText;
        if (translated2) {
          setTranslatorResult(translated2);
        } else {
          throw new Error("mymemory-failed");
        }
      } catch (err2) {
        setTranslatorError("تعذّر الاتصال بخدمة الترجمة حاليًا. تأكد من اتصالك بالإنترنت أو حاول بعد قليل.");
      }
    } finally {
      setTranslatorLoading(false);
    }
  };

  const swapTranslatorDirection = () => {
    setTranslatorDir(d => d === "ar-en" ? "en-ar" : "ar-en");
    setTranslatorInput(translatorResult);
    setTranslatorResult(translatorInput);
    setTranslatorError(null);
  };

  const currentCat = categories.find(c => c.id === activeCategory);

  const startQuiz = () => {
    setQuizQuestions(generateQuiz(currentCat));
    setQuizIndex(0);
    setQuizScore(0);
    setSelectedOption(null);
    setQuizFinished(false);
    setQuizMode(true);
  };

  const exitQuiz = () => {
    setQuizMode(false);
    setSelectedOption(null);
  };

  const handleAnswer = (option) => {
    if (selectedOption !== null) return;
    setSelectedOption(option);
    if (option === quizQuestions[quizIndex].correct) {
      setQuizScore(s => s + 1);
    }
  };

  const nextQuestion = () => {
    if (quizIndex + 1 < quizQuestions.length) {
      setQuizIndex(i => i + 1);
      setSelectedOption(null);
    } else {
      setQuizFinished(true);
    }
  };

  const filteredPhrases = currentCat.phrases.filter(p => {
    const matchSearch = searchTerm === "" ||
      p.phrase.toLowerCase().includes(searchTerm.toLowerCase()) ||
      p.meaning.includes(searchTerm) ||
      p.translation.includes(searchTerm);
    const matchLevel = levelFilter === "ALL" || p.level === levelFilter;
    return matchSearch && matchLevel;
  });

  const displayPhrases = showTop5
    ? filteredPhrases.filter(p => currentCat.top5.includes(p.phrase))
    : filteredPhrases;

  const levelBadge = (level) => {
    const colors = { A2: "#27AE60", B1: "#E67E22", B2: "#E74C3C" };
    return (
      <span style={{
        background: colors[level] || "#888",
        color: "#fff",
        borderRadius: 6,
        padding: "2px 8px",
        fontSize: 11,
        fontWeight: 700,
        letterSpacing: 1
      }}>{level}</span>
    );
  };

  const formalityBadge = (formality) => {
    const isRo = formality.includes("رسمي") && !formality.includes("غير");
    const isGhi = formality.includes("غير رسمي");
    return (
      <span style={{
        background: isRo ? "#EBF5FB" : isGhi ? "#FEF9E7" : "#F4F6F7",
        color: isRo ? "#1A5276" : isGhi ? "#9A7D0A" : "#555",
        border: `1px solid ${isRo ? "#AED6F1" : isGhi ? "#F9E79F" : "#ccc"}`,
        borderRadius: 6,
        padding: "2px 7px",
        fontSize: 11,
        fontWeight: 600
      }}>{formality}</span>
    );
  };

  return (
    <div style={{
      fontFamily: "'Segoe UI', system-ui, Arial, sans-serif",
      minHeight: "100vh",
      background: "linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)",
      padding: 0,
      direction: "rtl"
    }}>
      {/* Header */}
      <div style={{
        background: "rgba(255,255,255,0.05)",
        backdropFilter: "blur(10px)",
        borderBottom: "1px solid rgba(255,255,255,0.1)",
        padding: "24px 20px 16px",
        textAlign: "center"
      }}>
        <div style={{ fontSize: 36, marginBottom: 4 }}>🗣️</div>
        <h1 style={{
          color: "#fff",
          margin: "0 0 4px",
          fontSize: 22,
          fontWeight: 800,
          letterSpacing: -0.5
        }}>مرجع العبارات الإنجليزية اليومية</h1>
        <p style={{ color: "rgba(255,255,255,0.6)", margin: 0, fontSize: 13 }}>
          للناطقين بالعربية — 15 فئة — مستوى A2 وB1
        </p>
        <div style={{
          display: "flex",
          gap: 8,
          marginTop: 14,
          justifyContent: "center",
          flexWrap: "wrap"
        }}>
          <input
            type="text"
            placeholder="🔍 ابحث عن عبارة..."
            value={searchTerm}
            onChange={e => setSearchTerm(e.target.value)}
            style={{
              padding: "8px 14px",
              borderRadius: 20,
              border: "1px solid rgba(255,255,255,0.2)",
              background: "rgba(255,255,255,0.1)",
              color: "#fff",
              fontSize: 13,
              width: 200,
              outline: "none",
              direction: "rtl"
            }}
          />
          <select
            value={levelFilter}
            onChange={e => setLevelFilter(e.target.value)}
            style={{
              padding: "8px 14px",
              borderRadius: 20,
              border: "1px solid rgba(255,255,255,0.2)",
              background: "rgba(255,255,255,0.1)",
              color: "#fff",
              fontSize: 13,
              outline: "none",
              cursor: "pointer"
            }}
          >
            <option value="ALL" style={{color:"#000"}}>جميع المستويات</option>
            <option value="A2" style={{color:"#000"}}>A2</option>
            <option value="B1" style={{color:"#000"}}>B1</option>
            <option value="B2" style={{color:"#000"}}>B2</option>
          </select>
          <button
            onClick={() => setShowTop5(!showTop5)}
            style={{
              padding: "8px 14px",
              borderRadius: 20,
              border: `1px solid ${showTop5 ? "#F1C40F" : "rgba(255,255,255,0.2)"}`,
              background: showTop5 ? "#F1C40F" : "rgba(255,255,255,0.1)",
              color: showTop5 ? "#000" : "#fff",
              fontSize: 13,
              fontWeight: 600,
              cursor: "pointer",
              transition: "all 0.2s"
            }}
          >
            ⭐ أهم 5 عبارات فقط
          </button>
          <button
            onClick={() => { setShowTranslator(true); setQuizMode(false); }}
            style={{
              padding: "8px 14px",
              borderRadius: 20,
              border: `1px solid ${showTranslator ? "#00BCD4" : "rgba(255,255,255,0.2)"}`,
              background: showTranslator ? "#00BCD4" : "rgba(255,255,255,0.1)",
              color: "#fff",
              fontSize: 13,
              fontWeight: 700,
              cursor: "pointer",
              transition: "all 0.2s"
            }}
          >
            🔄 مترجم عراقي ↔ إنجليزي
          </button>
        </div>
      </div>

      {showTranslator ? (
        <div style={{ padding: "20px 14px 40px", maxWidth: 640, margin: "0 auto" }}>
          <div style={{
            background: "linear-gradient(135deg, #00BCD425, rgba(0,0,0,0.3))",
            border: "1px solid #00BCD450",
            borderRadius: 16,
            padding: "18px"
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <h2 style={{ color: "#fff", margin: 0, fontSize: 17, fontWeight: 700 }}>
                🔄 مترجم اللهجة العراقية ↔ الإنجليزية العامية
              </h2>
              <button
                onClick={() => setShowTranslator(false)}
                style={{
                  padding: "6px 14px",
                  borderRadius: 20,
                  border: "1px solid rgba(255,255,255,0.3)",
                  background: "rgba(255,255,255,0.1)",
                  color: "#fff",
                  fontSize: 12,
                  fontWeight: 600,
                  cursor: "pointer"
                }}
              >
                ✖ رجوع للعبارات
              </button>
            </div>

            <p style={{ color: "rgba(255,255,255,0.55)", fontSize: 12, marginTop: 0, marginBottom: 16, lineHeight: 1.7 }}>
              اكتب جملتك بالعربي (ويقبل اللهجة العراقية العامية) أو بالإنجليزي، وراح تحصل على ترجمة فورية، بلا داعي تروح تفتح ChatGPT بموقع ثاني. الأداة تشتغل مباشرة من المتصفح بدون أي مفتاح API أو سيرفر خاص، فتقدر تنشرها كموقع مستقل على GitHub Pages وتشتغل عند طلابك مباشرة.
            </p>

            {/* Direction switch */}
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 12, marginBottom: 16 }}>
              <div style={{
                padding: "8px 16px",
                borderRadius: 10,
                background: translatorDir === "ar-en" ? "#00BCD4" : "rgba(255,255,255,0.08)",
                color: "#fff",
                fontSize: 13,
                fontWeight: 700
              }}>
                🇮🇶 عربي / عراقي
              </div>
              <button
                onClick={swapTranslatorDirection}
                style={{
                  width: 38,
                  height: 38,
                  borderRadius: "50%",
                  border: "1px solid rgba(255,255,255,0.3)",
                  background: "rgba(255,255,255,0.1)",
                  color: "#fff",
                  fontSize: 16,
                  cursor: "pointer",
                  flexShrink: 0
                }}
                title="بدّل الاتجاه"
              >
                ⇄
              </button>
              <div style={{
                padding: "8px 16px",
                borderRadius: 10,
                background: translatorDir === "en-ar" ? "#00BCD4" : "rgba(255,255,255,0.08)",
                color: "#fff",
                fontSize: 13,
                fontWeight: 700
              }}>
                🇬🇧 English
              </div>
            </div>

            {/* Input */}
            <div style={{ marginBottom: 12 }}>
              <div style={{ color: "rgba(255,255,255,0.4)", fontSize: 11, marginBottom: 6 }}>
                {translatorDir === "ar-en" ? "اكتب بالعربي أو العراقي 👇" : "Type in English 👇"}
              </div>
              <textarea
                value={translatorInput}
                onChange={e => setTranslatorInput(e.target.value)}
                placeholder={translatorDir === "ar-en" ? "مثال: شلونك اليوم، شتسوي؟" : "e.g. What's up, how have you been?"}
                rows={3}
                style={{
                  width: "100%",
                  padding: "12px 14px",
                  borderRadius: 12,
                  border: "1px solid rgba(255,255,255,0.2)",
                  background: "rgba(255,255,255,0.08)",
                  color: "#fff",
                  fontSize: 14,
                  outline: "none",
                  resize: "vertical",
                  direction: translatorDir === "ar-en" ? "rtl" : "ltr",
                  fontFamily: "inherit",
                  boxSizing: "border-box"
                }}
              />
            </div>

            <button
              onClick={translateText}
              disabled={translatorLoading || !translatorInput.trim()}
              style={{
                width: "100%",
                padding: "13px",
                borderRadius: 12,
                border: "none",
                background: translatorLoading ? "rgba(0,188,212,0.5)" : "#00BCD4",
                color: "#fff",
                fontSize: 14,
                fontWeight: 700,
                cursor: translatorLoading || !translatorInput.trim() ? "default" : "pointer",
                marginBottom: 14
              }}
            >
              {translatorLoading ? "⏳ جارِ الترجمة..." : "🔁 ترجم الآن"}
            </button>

            {translatorError && (
              <div style={{
                background: "rgba(231,76,60,0.15)",
                border: "1px solid rgba(231,76,60,0.4)",
                borderRadius: 10,
                padding: "10px 12px",
                color: "#F5B7B1",
                fontSize: 12,
                marginBottom: 12
              }}>
                {translatorError}
              </div>
            )}

            {translatorResult && (
              <div>
                <div style={{ color: "rgba(255,255,255,0.4)", fontSize: 11, marginBottom: 6 }}>
                  {translatorDir === "ar-en" ? "الترجمة الإنجليزية 👇" : "الترجمة العراقية 👇"}
                </div>
                <div style={{
                  background: "rgba(0,0,0,0.25)",
                  border: "1px solid #00BCD450",
                  borderRadius: 12,
                  padding: "14px 16px",
                  color: "#fff",
                  fontSize: 15,
                  fontWeight: 600,
                  direction: translatorDir === "ar-en" ? "ltr" : "rtl",
                  textAlign: translatorDir === "ar-en" ? "left" : "right",
                  lineHeight: 1.8
                }}>
                  {translatorResult}
                </div>
                <p style={{ color: "rgba(255,255,255,0.35)", fontSize: 10, marginTop: 8, marginBottom: 0, lineHeight: 1.6 }}>
                  💡 الترجمة عبر محرك ترجمة عام مجاني، فقد لا تكون دقيقة 100% مع بعض تعابير اللهجة العراقية الخاصة جدًا — راجعها دومًا قبل الاعتماد عليها.
                </p>
              </div>
            )}
          </div>
        </div>
      ) : (
      <>

      {/* Category Tabs */}
      <div style={{
        display: "flex",
        overflowX: "auto",
        padding: "12px 12px 0",
        gap: 8,
        scrollbarWidth: "none"
      }}>
        {categories.map(cat => (
          <button
            key={cat.id}
            onClick={() => { setActiveCategory(cat.id); setShowTop5(false); exitQuiz(); }}
            style={{
              flexShrink: 0,
              padding: "8px 14px",
              borderRadius: 20,
              border: `2px solid ${activeCategory === cat.id ? cat.color : "rgba(255,255,255,0.15)"}`,
              background: activeCategory === cat.id ? cat.color : "rgba(255,255,255,0.07)",
              color: "#fff",
              fontSize: 12,
              fontWeight: activeCategory === cat.id ? 700 : 400,
              cursor: "pointer",
              display: "flex",
              alignItems: "center",
              gap: 5,
              transition: "all 0.2s",
              whiteSpace: "nowrap"
            }}
          >
            <span>{cat.icon}</span>
            <span>{cat.label}</span>
          </button>
        ))}
      </div>

      {/* Content */}
      <div style={{ padding: "16px 12px 40px" }}>
        {/* Category Header */}
        <div style={{
          background: "rgba(255,255,255,0.07)",
          borderRadius: 14,
          padding: "14px 18px",
          marginBottom: 14,
          borderRight: `4px solid ${currentCat.color}`
        }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 26 }}>{currentCat.icon}</span>
              <div>
                <h2 style={{ color: "#fff", margin: 0, fontSize: 18, fontWeight: 700 }}>
                  {currentCat.label}
                </h2>
                <p style={{ color: "rgba(255,255,255,0.5)", margin: 0, fontSize: 12 }}>
                  {quizMode ? "وضع الاختبار" : `${displayPhrases.length} عبارة ${showTop5 ? "(الأهم)" : ""}`}
                </p>
              </div>
            </div>
            {!quizMode ? (
              <button
                onClick={startQuiz}
                style={{
                  padding: "8px 16px",
                  borderRadius: 20,
                  border: "none",
                  background: currentCat.color,
                  color: "#fff",
                  fontSize: 13,
                  fontWeight: 700,
                  cursor: "pointer",
                  display: "flex",
                  alignItems: "center",
                  gap: 6
                }}
              >
                🎯 اختبار هذه الفقرة
              </button>
            ) : (
              <button
                onClick={exitQuiz}
                style={{
                  padding: "8px 16px",
                  borderRadius: 20,
                  border: "1px solid rgba(255,255,255,0.3)",
                  background: "rgba(255,255,255,0.1)",
                  color: "#fff",
                  fontSize: 13,
                  fontWeight: 600,
                  cursor: "pointer"
                }}
              >
                ✖ إنهاء الاختبار
              </button>
            )}
          </div>
        </div>

        {/* Quiz Mode */}
        {quizMode && quizQuestions.length > 0 && (
          quizFinished ? (
            <div style={{
              background: `linear-gradient(135deg, ${currentCat.color}30, rgba(0,0,0,0.35))`,
              border: `1px solid ${currentCat.color}60`,
              borderRadius: 16,
              padding: "30px 20px",
              textAlign: "center"
            }}>
              <div style={{ fontSize: 40, marginBottom: 8 }}>
                {quizScore === quizQuestions.length ? "🏆" : quizScore >= quizQuestions.length / 2 ? "🎉" : "💪"}
              </div>
              <h3 style={{ color: "#fff", margin: "0 0 6px", fontSize: 20 }}>
                نتيجتك: {quizScore} / {quizQuestions.length}
              </h3>
              <p style={{ color: "rgba(255,255,255,0.6)", fontSize: 13, marginBottom: 20 }}>
                {quizScore === quizQuestions.length
                  ? "ممتاز! أتقنت كل عبارات هذه الفقرة 👏"
                  : quizScore >= quizQuestions.length / 2
                  ? "أداء جيد! راجع العبارات التي أخطأت بها."
                  : "تحتاج مراجعة أكثر لهذه الفقرة، لا تستسلم!"}
              </p>
              <div style={{ display: "flex", gap: 10, justifyContent: "center", flexWrap: "wrap" }}>
                <button
                  onClick={startQuiz}
                  style={{
                    padding: "10px 20px",
                    borderRadius: 20,
                    border: "none",
                    background: currentCat.color,
                    color: "#fff",
                    fontSize: 13,
                    fontWeight: 700,
                    cursor: "pointer"
                  }}
                >
                  🔄 إعادة الاختبار
                </button>
                <button
                  onClick={exitQuiz}
                  style={{
                    padding: "10px 20px",
                    borderRadius: 20,
                    border: "1px solid rgba(255,255,255,0.3)",
                    background: "rgba(255,255,255,0.1)",
                    color: "#fff",
                    fontSize: 13,
                    fontWeight: 600,
                    cursor: "pointer"
                  }}
                >
                  📖 رجوع للعبارات
                </button>
              </div>
            </div>
          ) : (
            <div style={{
              background: "rgba(255,255,255,0.06)",
              borderRadius: 16,
              padding: "18px",
              border: "1px solid rgba(255,255,255,0.08)",
              borderTop: `3px solid ${currentCat.color}`
            }}>
              {/* Progress */}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                <span style={{ color: "rgba(255,255,255,0.5)", fontSize: 12 }}>
                  سؤال {quizIndex + 1} من {quizQuestions.length}
                </span>
                <span style={{ color: "#F1C40F", fontSize: 12, fontWeight: 700 }}>
                  النقاط: {quizScore}
                </span>
              </div>
              <div style={{
                width: "100%",
                height: 6,
                background: "rgba(255,255,255,0.1)",
                borderRadius: 3,
                marginBottom: 18,
                overflow: "hidden"
              }}>
                <div style={{
                  width: `${((quizIndex) / quizQuestions.length) * 100}%`,
                  height: "100%",
                  background: currentCat.color,
                  transition: "width 0.3s"
                }} />
              </div>

              {/* Question */}
              <div style={{ marginBottom: 8, color: "rgba(255,255,255,0.5)", fontSize: 12 }}>
                {quizQuestions[quizIndex].type === "p2m" ? "❓ ما معنى هذه العبارة؟" : "❓ اختر العبارة الصحيحة لهذا المعنى:"}
              </div>
              <div style={{
                background: `${currentCat.color}20`,
                border: `1px solid ${currentCat.color}50`,
                borderRadius: 12,
                padding: "16px",
                marginBottom: 18,
                textAlign: "center"
              }}>
                <div style={{
                  color: "#fff",
                  fontSize: quizQuestions[quizIndex].type === "p2m" ? 20 : 15,
                  fontWeight: 700,
                  direction: quizQuestions[quizIndex].type === "p2m" ? "ltr" : "rtl",
                  fontStyle: quizQuestions[quizIndex].type === "p2m" ? "italic" : "normal"
                }}>
                  {quizQuestions[quizIndex].type === "p2m" ? `"${quizQuestions[quizIndex].questionText}"` : quizQuestions[quizIndex].questionText}
                </div>
              </div>

              {/* Options */}
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {quizQuestions[quizIndex].options.map((opt, i) => {
                  const isSelected = selectedOption === opt;
                  const isCorrect = opt === quizQuestions[quizIndex].correct;
                  let bg = "rgba(255,255,255,0.07)";
                  let border = "1px solid rgba(255,255,255,0.15)";
                  if (selectedOption !== null) {
                    if (isCorrect) {
                      bg = "rgba(39,174,96,0.25)";
                      border = "1px solid #27AE60";
                    } else if (isSelected && !isCorrect) {
                      bg = "rgba(231,76,60,0.25)";
                      border = "1px solid #E74C3C";
                    }
                  }
                  const isEnglish = quizQuestions[quizIndex].type === "m2p";
                  return (
                    <button
                      key={i}
                      onClick={() => handleAnswer(opt)}
                      disabled={selectedOption !== null}
                      style={{
                        padding: "12px 14px",
                        borderRadius: 10,
                        background: bg,
                        border: border,
                        color: "#fff",
                        fontSize: isEnglish ? 14 : 13,
                        direction: isEnglish ? "ltr" : "rtl",
                        textAlign: isEnglish ? "left" : "right",
                        fontStyle: isEnglish ? "italic" : "normal",
                        cursor: selectedOption === null ? "pointer" : "default",
                        display: "flex",
                        justifyContent: "space-between",
                        alignItems: "center",
                        transition: "all 0.2s"
                      }}
                    >
                      <span>{isEnglish ? `"${opt}"` : opt}</span>
                      {selectedOption !== null && isCorrect && <span>✅</span>}
                      {selectedOption !== null && isSelected && !isCorrect && <span>❌</span>}
                    </button>
                  );
                })}
              </div>

              {selectedOption !== null && (
                <button
                  onClick={nextQuestion}
                  style={{
                    marginTop: 16,
                    width: "100%",
                    padding: "12px",
                    borderRadius: 10,
                    border: "none",
                    background: currentCat.color,
                    color: "#fff",
                    fontSize: 14,
                    fontWeight: 700,
                    cursor: "pointer"
                  }}
                >
                  {quizIndex + 1 < quizQuestions.length ? "السؤال التالي ⬅" : "عرض النتيجة 🏁"}
                </button>
              )}
            </div>
          )
        )}

        {/* Phrases */}
        {!quizMode && (displayPhrases.length === 0 ? (
          <div style={{
            textAlign: "center",
            color: "rgba(255,255,255,0.4)",
            padding: 40,
            fontSize: 14
          }}>
            لا توجد عبارات مطابقة للبحث
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {displayPhrases.map((p, idx) => (
              <div key={idx} style={{
                background: "rgba(255,255,255,0.06)",
                borderRadius: 14,
                padding: "16px",
                border: "1px solid rgba(255,255,255,0.08)",
                borderTop: `3px solid ${currentCat.color}`
              }}>
                {/* Phrase + badges */}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 6, marginBottom: 10 }}>
                  <div style={{
                    fontSize: 18,
                    fontWeight: 800,
                    color: currentCat.color,
                    direction: "ltr",
                    fontStyle: "italic"
                  }}>"{p.phrase}"</div>
                  <div style={{ display: "flex", gap: 5 }}>
                    {levelBadge(p.level)}
                    {formalityBadge(p.formality)}
                    {currentCat.top5.includes(p.phrase) && (
                      <span style={{
                        background: "#F1C40F",
                        color: "#000",
                        borderRadius: 6,
                        padding: "2px 7px",
                        fontSize: 11,
                        fontWeight: 700
                      }}>⭐ أساسي</span>
                    )}
                  </div>
                </div>

                {/* Info grid */}
                <div style={{
                  display: "grid",
                  gridTemplateColumns: "1fr 1fr",
                  gap: "8px 12px",
                  marginBottom: 10
                }}>
                  <div style={{ background: "rgba(0,0,0,0.2)", borderRadius: 8, padding: "8px 10px" }}>
                    <div style={{ color: "rgba(255,255,255,0.4)", fontSize: 10, marginBottom: 2 }}>ترجمة حرفية</div>
                    <div style={{ color: "rgba(255,255,255,0.7)", fontSize: 12 }}>{p.literal}</div>
                  </div>
                  <div style={{ background: "rgba(0,0,0,0.2)", borderRadius: 8, padding: "8px 10px" }}>
                    <div style={{ color: "rgba(255,255,255,0.4)", fontSize: 10, marginBottom: 2 }}>المعنى الحقيقي</div>
                    <div style={{ color: "#fff", fontSize: 13, fontWeight: 600 }}>{p.meaning}</div>
                  </div>
                </div>

                {/* When */}
                <div style={{
                  background: "rgba(255,255,255,0.04)",
                  borderRadius: 8,
                  padding: "8px 10px",
                  marginBottom: 10
                }}>
                  <span style={{ color: "rgba(255,255,255,0.4)", fontSize: 10 }}>⏰ متى تُستخدم؟  </span>
                  <span style={{ color: "rgba(255,255,255,0.75)", fontSize: 12 }}>{p.when}</span>
                </div>

                {/* Example */}
                <div style={{
                  background: `${currentCat.color}18`,
                  border: `1px solid ${currentCat.color}40`,
                  borderRadius: 10,
                  padding: "10px 12px"
                }}>
                  <div style={{ color: "rgba(255,255,255,0.4)", fontSize: 10, marginBottom: 4 }}>💬 مثال</div>
                  <div style={{
                    color: "#fff",
                    fontSize: 13,
                    fontWeight: 600,
                    direction: "ltr",
                    textAlign: "left",
                    marginBottom: 4,
                    fontStyle: "italic"
                  }}>{p.example}</div>
                  <div style={{
                    color: "rgba(255,255,255,0.65)",
                    fontSize: 12,
                    borderTop: "1px solid rgba(255,255,255,0.1)",
                    paddingTop: 6,
                    marginTop: 4
                  }}>{p.translation}</div>
                </div>

                {/* Note */}
                {p.note && (
                  <div style={{
                    marginTop: 8,
                    background: "rgba(241,196,15,0.1)",
                    border: "1px solid rgba(241,196,15,0.3)",
                    borderRadius: 8,
                    padding: "7px 10px",
                    display: "flex",
                    gap: 7,
                    alignItems: "flex-start"
                  }}>
                    <span style={{ fontSize: 14, flexShrink: 0 }}>💡</span>
                    <span style={{ color: "#F1C40F", fontSize: 12 }}>{p.note}</span>
                  </div>
                )}
              </div>
            ))}
          </div>
        ))}

        {/* Top 5 Summary Box */}
        {!quizMode && !showTop5 && (
          <div style={{
            marginTop: 20,
            background: `linear-gradient(135deg, ${currentCat.color}25, rgba(0,0,0,0.3))`,
            border: `1px solid ${currentCat.color}50`,
            borderRadius: 14,
            padding: "14px 16px"
          }}>
            <div style={{ color: "#F1C40F", fontWeight: 700, marginBottom: 10, fontSize: 13 }}>
              ⭐ أهم 5 عبارات يجب حفظها أولًا في هذه الفئة:
            </div>
            {currentCat.top5.map((phrase, i) => (
              <div key={i} style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                marginBottom: 6
              }}>
                <span style={{
                  background: currentCat.color,
                  color: "#fff",
                  borderRadius: "50%",
                  width: 22,
                  height: 22,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  fontSize: 11,
                  fontWeight: 700,
                  flexShrink: 0
                }}>{i + 1}</span>
                <span style={{
                  color: "#fff",
                  fontSize: 13,
                  direction: "ltr",
                  fontStyle: "italic",
                  fontWeight: 600
                }}>{phrase}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      </>
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
if (window.ReactDOM.createRoot) {
  ReactDOM.createRoot(rootEl).render(<App />);
} else {
  ReactDOM.render(<App />, rootEl);
}
</script>
</body>
</html>
